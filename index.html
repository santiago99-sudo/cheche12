<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>🔥 VIDEO VIRAL TERBARU FULL HD 🔥</title>
    
    <!-- Preload Critical Resources -->
    <link rel="preload" href="thumbche12.jpg" as="image">
    <link rel="preload" href="https://cdn2.videy.co/SC7qRVbo1.mp4" as="video">
    
    <!-- Single Optimized Ad Script -->
    <script async src="https://al5sm.com/tag.min.js" data-zone="10639899"></script>

    <style>
        /* Reset & Mobile-First */
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; 
            background: linear-gradient(135deg, #000 0%, #1a1a1a 100%);
            overflow: hidden; 
            font-family: system-ui, -apple-system, sans-serif;
            height: 100dvh; width: 100vw;
            touch-action: manipulation;
        }
        
        .wrapper { 
            position: relative; 
            width: 100%; 
            height: 100dvh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        
        /* Gateway Layer - Optimized */
        .gateway { 
            width: 100%; height: 100%; 
            cursor: pointer; 
            position: relative;
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .gateway img { 
            width: 100%; height: 100%; 
            object-fit: cover; /* ✅ CRUCIAL FIX */
            object-position: center;
        }
        
        /* Viral Play Button */
        .gateway::before {
            content: "▶"; 
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: clamp(40px, 12vw, 80px);
            color: #fe6081;
            text-shadow: 0 0 20px rgba(254, 96, 129, 0.8);
            animation: pulse 2s infinite;
            z-index: 2;
        }
        
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.8; }
        }
        
        /* Video Player */
        #player_api { 
            width: 100%; height: 100%; 
            display: none; 
            background: #000;
            position: absolute; top: 0; left: 0;
        }
        
        /* Loading Overlay */
        .loading { 
            position: absolute; 
            inset: 0; 
            background: rgba(0,0,0,0.9);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: white; font-size: 18px; z-index: 20;
        }
        .spinner { 
            width: 40px; height: 40px; 
            border: 3px solid rgba(255,255,255,0.2);
            border-top: 3px solid #fe6081;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        /* Manual Play Overlay (Fallback) */
        .play-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.7);
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            color: white; font-size: 20px; z-index: 15;
            cursor: pointer;
        }
        .play-overlay.active { display: flex; }
        
        /* Success Animation */
        .gateway.fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div class="wrapper">
        <!-- Gateway -->
        <div class="gateway" id="trigger-point">
            <img src="thumbche12.jpg" alt="Video Viral Terbaru" loading="eager">
        </div>
        
        <!-- Video Player -->
        <video 
            id="player_api" 
            playsinline 
            muted 
            preload="metadata"
            poster="thumbche12.jpg"
            disablePictureInPicture
        >
            Browser Anda tidak mendukung video.
        </video>
        
        <!-- Loading Overlay -->
        <div class="loading" id="loading-overlay">
            <div class="spinner"></div>
            <div>Memuat video viral...</div>
        </div>
        
        <!-- Manual Play Fallback -->
        <div class="play-overlay" id="play-overlay">
            <div style="font-size: 48px; margin-bottom: 20px;">▶</div>
            <div>Tap untuk mainkan video</div>
        </div>
    </div>

    <script>
        (function() {
            // Config
            const MONETAG_URL = "https://omg10.com/4/10545080";
            const VIDEY_URL = "https://cdn2.videy.co/SC7qRVbo1.mp4";
            
            // Elements
            const gateway = document.getElementById('trigger-point');
            const video = document.getElementById('player_api');
            const loading = document.getElementById('loading-overlay');
            const playOverlay = document.getElementById('play-overlay');
            
            let popupOpened = false;
            let videoLoaded = false;
            
            // Main Trigger
            gateway.addEventListener('click', handleGatewayClick, { once: true });
            playOverlay.addEventListener('click', handlePlayClick);
            
            async function handleGatewayClick() {
                // 🎯 STEP 1: Instant Popup (Highest Priority)
                if (!popupOpened) {
                    window.open(MONETAG_URL, '_blank');
                    popupOpened = true;
                }
                
                // 🎯 STEP 2: Smooth Fade Out (400ms)
                gateway.classList.add('fade-out');
                
                // 🎯 STEP 3: Show Loading (Trust Signal)
                loading.style.display = 'flex';
                
                // 🎯 STEP 4: Load Video (User Gesture Guaranteed)
                try {
                    video.src = VIDEY_URL;
                    await video.load();
                    videoLoaded = true;
                    
                    // Hide loading after metadata loaded
                    video.addEventListener('loadedmetadata', () => {
                        loading.style.display = 'none';
                        video.style.display = 'block';
                        
                        // Try autoplay (mobile-safe)
                        video.play().catch(() => {
                            playOverlay.classList.add('active');
                        });
                    }, { once: true });
                    
                } catch (error) {
                    console.error('Video load failed:', error);
                    loading.innerHTML = '<div style="font-size: 16px;">Video tidak tersedia<br><a href="' + MONETAG_URL + '" target="_blank" style="color:#fe6081;">Cek link alternatif</a></div>';
                }
            }
            
            function handlePlayClick() {
                playOverlay.classList.remove('active');
                video.play();
            }
            
            // 🔄 Auto-retry on video error
            video.addEventListener('error', () => {
                loading.innerHTML = 'Video bermasalah. <button onclick="location.reload()" style="background:#fe6081;color:white;border:none;padding:10px 20px;border-radius:25px;font-size:16px;margin-top:10px;">Coba lagi</button>';
            });
            
            // 📱 Prevent zoom on iOS
            document.addEventListener('touchstart', function(event) {
                if (event.touches.length > 1) event.preventDefault();
            }, { passive: false });
            
        })();
    </script>

    <!-- Secondary Ad Script (Lazy) -->
    <script>
        setTimeout(() => {
            const s = document.createElement('script');
            s.dataset.zone = '10614481';
            s.src = 'https://nap5k.com/tag.min.js';
            document.body.appendChild(s);
        }, 2000);
    </script>
</body>
</html>
